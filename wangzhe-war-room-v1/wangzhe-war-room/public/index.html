<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="王者荣耀内战长期报名与随机分组">
  <title>王者内战 · 随机组队</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="bg-glow"></div>
  <main class="shell">
    <header class="hero">
      <div class="eyebrow"><span class="live-dot"></span> GROUP BATTLE · 5V5</div>
      <h1>王者内战<span>随机组队</span></h1>
      <p>一个链接，全群报名。位置齐全，才能开战。</p>
      <div class="hero-stats">
        <div><strong id="playerCount">—</strong><small>已报名</small></div>
        <div><strong>5<span>V</span>5</strong><small>标准对局</small></div>
        <div><strong>5</strong><small>分路位置</small></div>
      </div>
    </header>

    <section class="panel">
      <div class="section-head">
        <div><span class="step">01</span><h2>加入报名</h2></div>
        <span class="hint">昵称最多 20 字 · 位置可多选</span>
      </div>
      <form id="signupForm">
        <input type="hidden" id="editId">
        <label for="nickname">游戏昵称</label>
        <input id="nickname" maxlength="20" placeholder="输入你的王者昵称" autocomplete="off" required>
        <label>你能打的位置</label>
        <div class="role-picker" id="rolePicker">
          <label class="role-option"><input type="checkbox" value="中路"><span><b>🧙</b>中路</span></label>
          <label class="role-option"><input type="checkbox" value="打野"><span><b>⚔️</b>打野</span></label>
          <label class="role-option"><input type="checkbox" value="辅助"><span><b>🛡️</b>辅助</span></label>
          <label class="role-option"><input type="checkbox" value="射手"><span><b>🏹</b>射手</span></label>
          <label class="role-option"><input type="checkbox" value="边路"><span><b>🗡️</b>边路</span></label>
        </div>
        <div class="form-actions">
          <button class="btn primary" id="submitBtn" type="submit">确认报名</button>
          <button class="btn ghost hidden" id="cancelEdit" type="button">取消修改</button>
        </div>
      </form>
      <p class="privacy-note">公开群报名：所有拿到链接的人都可以查看、修改和删除名单。</p>
    </section>

    <section class="panel">
      <div class="section-head">
        <div><span class="step">02</span><h2>报名名单</h2></div>
        <button class="text-btn" id="refreshBtn" type="button">↻ 刷新</button>
      </div>
      <div class="toolbar">
        <input id="search" class="search" placeholder="搜索昵称…" autocomplete="off">
        <span id="listCount" class="count">0 人</span>
      </div>
      <div id="playerList" class="player-list"><div class="empty">正在加载报名名单…</div></div>
    </section>

    <section class="panel battle-panel">
      <div class="section-head">
        <div><span class="step">03</span><h2>创建两队</h2></div>
        <span class="hint">选择 10 人</span>
      </div>
      <div class="selection-bar">
        <span>已选择参战人员</span><strong><span id="selectedCount">0</span> / 10</strong>
      </div>
      <div class="progress"><i id="selectionProgress"></i></div>
      <p class="subhint">勾选上方报名名单中的10名玩家。分组时每个人只会被分配到一个位置。</p>
      <button class="btn battle-btn" id="createBtn" type="button" disabled>⚔ 随机创建两队</button>
      <div id="errorBox" class="message error hidden" role="alert"></div>
      <div id="result" class="result hidden"></div>
    </section>

    <section class="panel history-panel">
      <div class="section-head"><div><span class="step">04</span><h2>最近分组</h2></div></div>
      <div id="historyList" class="history-list"><div class="empty">暂无历史分组</div></div>
    </section>
    <footer>王者内战 · 祝你把把 MVP <span>非官方玩家工具</span></footer>
  </main>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
